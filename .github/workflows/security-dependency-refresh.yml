name: Refresh security dependencies

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/security-dependency-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Upgrade affected build tools
        run: npm install --save-dev vite@8.1.5 @vitejs/plugin-react@6.0.4 wrangler@4.114.0 sharp@0.35.3

      - name: Apply compatible advisory fixes
        run: npm audit fix

      - name: Verify dependency security
        run: npm audit --audit-level=high

      - name: Verify application security
        run: npm run security:check

      - name: Build production bundle
        run: npm run build

      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- package.json package-lock.json dist; then
            exit 0
          fi
          git config user.name "fear.social security bot"
          git config user.email "contact@fear.social"
          git add package.json package-lock.json dist
          git commit -m "Refresh vulnerable build dependencies [skip ci]"
          git push origin HEAD:main
